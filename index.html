<!DOCTYPE html>
<html>
<head>
<title>Pak RT Tekkom</title>
<style>
body{
background:linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
color:#e5e5e5;
font-family:Segoe UI, Arial;
margin:0;
padding:20px;
min-height:100vh
}
h2{
text-align:center;
background:linear-gradient(90deg, #3b82f6, #8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
font-size:28px;
margin-bottom:20px
}
#chat{
height:400px;
overflow:auto;
background:rgba(20,20,30,0.6);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
margin-bottom:15px;
border:1px solid rgba(59,130,246,0.2)
}
.msg{
margin:12px 0;
padding:14px 20px;
border-radius:15px;
max-width:92%;
word-wrap:break-word;
white-space:pre-wrap;
line-height:1.7;
font-size:15px;
animation:fadeIn 0.3s
}
@keyframes fadeIn{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
.user{
background:linear-gradient(135deg, #3b82f6, #2563eb);
margin-left:auto;
text-align:right;
max-width:80%;
box-shadow:0 4px 15px rgba(59,130,246,0.3)
}
.bot{
background:rgba(38,38,55,0.8);
border-left:3px solid #8b5cf6;
margin-right:auto;
max-width:92%;
box-shadow:0 4px 15px rgba(0,0,0,0.3)
}
.input-area{
display:flex;
gap:10px;
margin-top:10px
}
input{
flex:1;
padding:14px 18px;
background:rgba(30,30,40,0.8);
color:white;
border:1px solid rgba(59,130,246,0.3);
border-radius:12px;
font-size:16px;
outline:none
}
input:focus{
border-color:#3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,0.2)
}
button{
padding:14px 24px;
background:linear-gradient(135deg, #3b82f6, #8b5cf6);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
font-size:15px;
transition:0.2s
}
button:hover{
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(59,130,246,0.4)
}
button:active{
transform:translateY(0)
}
</style>
</head>
<body>
<h2>🤖 Pak RT Tekkom AI</h2>
<div id="chat">
<div class="msg bot">Halo! Klik VLSM buat test</div>
</div>
<input id="inp" placeholder="Ketik vlsm..." onkeypress="if(event.key=='Enter')kirim()">
<button onclick="kirim()">Kirim</button>
<button onclick="set('vlsm')">VLSM</button>
<button onclick="set('fiber')">Fiber</button>
<button onclick="set('5g')">5G</button>

<script>
var data={
vlsm:'VLSM = Variable Length Subnet Mask\nHemat IP. Contoh: Kantor 200 host=/24, Cabang 50 host=/26, Cabang 10 host=/28\nTekkom S1 wajib bisa',
fiber:'Fiber Optik:\nSingle Mode: inti 9um, laser, 100km, backbone\nMulti Mode: inti 50um, LED, 2km, gedung\nRumus: RX = TX - redaman',
'5g':'5G New Radio:\nKecepatan 20Gbps\nLatensi 1ms URLLC\nTeknologi: Massive MIMO, Beamforming',

subnetting:'SUBNETTING DASAR WAJIB HAFAL\n1. Cari Block Size: 256 - subnet mask\n   Contoh /26: 256-192 = 64\n2. Network ID: kelipatan Block Size\n   /26: 0, 64, 128, 192...\n3. Broadcast: Network + Block - 1\n   0+64-1 = 63\n4. Host Valid: Network+1 s/d Broadcast-1\n   1 sampai 62',

rumus_subnet:'RUMUS CEPAT SUBNETTING\nHost = 2^(32-prefix) - 2\n/24 = 2^8-2 = 254 host\n/25 = 2^7-2 = 126 host\n/26 = 2^6-2 = 62 host\n/27 = 2^5-2 = 30 host\n/28 = 2^4-2 = 14 host\n/29 = 2^3-2 = 6 host\n/30 = 2^2-2 = 2 host = buat P2P router',

contoh_soal:'CONTOH SOAL UTS TEKKOM\nIP: 192.168.1.100/26\nDitanya: Network, Broadcast, Host Valid?\nJawab:\nBlock = 256-192 = 64\nNetwork = 192.168.1.64\nBroadcast = 64+64-1 = 127\nHost Valid = 65 sampai 126\nTotal host = 62',

cidr:'CIDR = Classless Inter-Domain Routing\nMenggantikan sistem kelas A/B/C\nNotasi: IP/Prefix\nContoh: 192.168.1.0/24 = 256 IP\n/24 = subnet mask 255.255.255.0\n/16 = 255.255.0.0\n/8 = 255.0.0.0\nSemakin besar prefix = semakin kecil jaringan'
};

function kirim(){
var t=document.getElementById('inp').value;
if(t=='')return;
tampil(t,'user');
document.getElementById('inp').value='';
var jawab='Materi belum ada. Coba: vlsm, fiber, 5g';
t=t.toLowerCase();
for(var k in data){
if(t.indexOf(k)>=0){jawab=data[k];break;}
}
setTimeout(function(){tampil(jawab,'bot');},500);
}

function tampil(teks,tipe){
document.getElementById('chat').innerHTML+='<div class="msg '+tipe+'">'+teks+'</div>';
document.getElementById('chat').scrollTop=9999;
}

function set(txt){
document.getElementById('inp').value=txt;
kirim();
}
</script>
</body>
</html>
